<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Abdullah Imran">
  <style>
    .bg { fill: #08090c; }
    .frame { fill: none; stroke: #6f93b3; stroke-width: 1.25; }
    .mark { fill: #6f93b3; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 15px; font-weight: 700; letter-spacing: -0.06em; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #eef1f4; }
      .frame { stroke: #4a6d8a; }
      .mark { fill: #4a6d8a; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="8" />
  <rect class="frame" x="1.5" y="1.5" width="29" height="29" rx="6.5" />
  <text class="mark" x="16" y="16.5" text-anchor="middle" dominant-baseline="central">AI</text>
</svg>
